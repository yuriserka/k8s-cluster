# Default values for dev.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ""
  pullPolicy: Never
  tag: ""

container:
  cmd: null
  args: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

# Optional pod hardening — leave empty for dev; set per-app when experimenting.
podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
# allowPrivilegeEscalation: false
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

service:
  enabled: true
  type: ClusterIP
  port: 80

env: {}
secretEnv: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe: null
readinessProbe: null
startupProbe: null

autoscaling:
  enabled: false

terminationGracePeriodSeconds: 60

lifecycle: {}

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
