vaultShared:
  - aws

cmd:
  - /docker-entrypoint.sh

args:
  - python
  - "-m"
  - "gunicorn"
  - "kafkaworker.asgi:application"
  - "-k"
  - "uvicorn.workers.UvicornWorker"
  - "-b"
  - "0.0.0.0:8000"
  - "--graceful-timeout"
  - "30"
  - "--timeout"
  - "60"

port: 8000

env:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

livenessProbePath: /metrics
readinessProbePath: /metrics
