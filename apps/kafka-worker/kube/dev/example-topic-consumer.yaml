vaultShared:
  - aws

cmd:
  - /docker-entrypoint.sh

args:
  - python
  - manage.py
  - "start_example_events_consumer"

env:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_CONSUMER_GROUP_ID: kafka-worker
  KAFKA_TOPICS_EXAMPLE_EVENTS: example-topic

livenessProbeCmd:
  - python
  - worker_health_check.py
readinessProbeCmd:
  - python
  - worker_health_check.py
