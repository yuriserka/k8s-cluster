# Start shared infra first: cd ../infra && docker compose up -d
# Then start app services only:
#   docker compose up -d --build --no-deps api scheduler example-topic-consumer

x-database-env: &database-env
  DJANGO_SETTINGS_MODULE: kafkaworker.config.settings
  DATABASE_HOST: postgres
  DATABASE_USER: ysdcr
  DATABASE_PASSWORD: ysdcr
  DATABASE_NAME: kafka-worker
  DATABASE_PORT: "5432"

x-aws-env: &aws-env
  AWS_ENDPOINT_URL: http://localstack:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

x-otel-vault-env-file: &otel-vault-env-file
  ../../resources/vault/_admin/grafana/dev/.env

networks:
  k8s-cluster-local:
    name: k8s-cluster-local
    external: true

services:
  api:
    image: kafka-worker-api-local:latest
    build:
      context: .
      dockerfile: kafkaworker/containers/Dockerfile.dev
      args:
        CONTAINER: api
    ports:
      - "8000:8000"
    env_file:
      - *otel-vault-env-file
    environment:
      <<: [*database-env, *aws-env]
      OTEL_SERVICE_NAME: kafka-worker-api
    command:
      - python
      - -m
      - gunicorn
      - kafkaworker.asgi:application
      - -k
      - uvicorn.workers.UvicornWorker
      - --bind
      - 0.0.0.0:8000
      - --graceful-timeout
      - "30"
      - --timeout
      - "60"
    networks:
      - k8s-cluster-local
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: always

  scheduler:
    image: kafka-worker-scheduler-local:latest
    build:
      context: .
      dockerfile: kafkaworker/containers/Dockerfile.dev
      args:
        CONTAINER: scheduler
    ports:
      - "8006:8006"
    env_file:
      - *otel-vault-env-file
    environment:
      <<: [*database-env]
      OTEL_SERVICE_NAME: kafka-worker-scheduler
    command:
      - python
      - manage.py
      - start_scheduler
    networks:
      - k8s-cluster-local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    restart: always

  example-topic-consumer:
    image: kafka-worker-example-topic-consumer-local:latest
    build:
      context: .
      dockerfile: kafkaworker/containers/Dockerfile.dev
      args:
        CONTAINER: example-topic-consumer
    ports:
      - "8005:8005"
    env_file:
      - *otel-vault-env-file
    environment:
      <<: [*database-env, *aws-env]
      OTEL_SERVICE_NAME: kafka-worker-example-topic-consumer
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: kafka-worker
      KAFKA_TOPICS_EXAMPLE_EVENTS: example-topic
    command:
      - python
      - manage.py
      - start_example_events_consumer
    networks:
      - k8s-cluster-local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    restart: always
