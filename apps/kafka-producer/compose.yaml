# Start shared infra first: cd ../infra && docker compose up -d
# Then start app services only:
#   docker compose up -d --build --no-deps api scheduler

x-otel-vault-env-file: &otel-vault-env-file
  ../../resources/vault/_admin/grafana/dev/.env

x-app-env: &app-env
  SPRING_PROFILE: local

networks:
  k8s-cluster-local:
    name: k8s-cluster-local
    external: true

services:
  api:
    image: kafka-producer-api-local:latest
    build:
      context: .
      dockerfile: app/containers/Dockerfile.dev
      args:
        CONTAINER: api
    ports:
      - "8080:8080"
    env_file:
      - *otel-vault-env-file
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: kafka-producer-api
      OTEL_JAVAAGENT_ENABLED: "true"
    networks:
      - k8s-cluster-local
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: always

  scheduler:
    image: kafka-producer-scheduler-local:latest
    build:
      context: .
      dockerfile: app/containers/Dockerfile.dev
      args:
        CONTAINER: scheduler
    ports:
      - "8081:8080"
    env_file:
      - *otel-vault-env-file
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: kafka-producer-scheduler
      OTEL_JAVAAGENT_ENABLED: "true"
    networks:
      - k8s-cluster-local
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    restart: always
