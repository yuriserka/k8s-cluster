buildscript {
    repositories {
        jcenter()
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }

    dependencies {
        classpath "org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}"
    }
}

plugins {
    id 'java'
    id 'io.spring.dependency-management' version "${dependencyManagementPluginVersion}"
	id 'org.springframework.boot' version "${springBootVersion}"
}

def loadPipelineDbCredentials() {
    def credsFile = rootProject.file('db-credentials')
    if (!credsFile.exists()) {
        return [:]
    }
    def creds = [:]
    credsFile.eachLine { line ->
        line = line.trim()
        if (!line || line.startsWith('#')) {
            return
        }
        def separator = line.indexOf('=')
        if (separator > 0) {
            creds[line.substring(0, separator)] = line.substring(separator + 1)
        }
    }
    return creds
}

allprojects {
    group = 'com.github.yuriserka'
    version = '0.0.1-SNAPSHOT'

    java {
        sourceCompatibility = '21'
        targetCompatibility = '21'
    }

    repositories {
        mavenCentral()
    }

    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
	apply plugin: 'org.springframework.boot'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
            mavenBom "com.fasterxml.jackson:jackson-bom:${jacksonVersion}"
        }
    }
}

subprojects {
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        failFast = true
        loadPipelineDbCredentials().each { key, value ->
            environment key, value
        }
    }

    configurations {
	    compileOnly {
		    extendsFrom annotationProcessor
	    }
    }

   dependencies {
        implementation "org.springframework.boot:spring-boot-starter-actuator:${springBootVersion}"
        developmentOnly "org.springframework.boot:spring-boot-devtools:${springBootVersion}"
        testImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"

        implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
        implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

        implementation "org.springframework.kafka:spring-kafka:${springKafkaVersion}"

        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

        implementation "org.mapstruct:mapstruct:${mapstructVersion}"
		annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
		testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	    implementation "net.datafaker:datafaker:${dataFakerVersion}"
    }
}

bootJar {
    enabled = false
}

jar {
    enabled = false
}
