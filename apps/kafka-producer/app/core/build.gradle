buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.flywaydb:flyway-database-postgresql:${flywayVersion}")
    }
}

plugins {
    id "org.flywaydb.flyway" version "${flywayVersion}"
    id 'java-test-fixtures'
}

jar {
	enabled = true
}

bootJar {
	enabled = false
}

dependencies {
	implementation "org.springframework.cloud:spring-cloud-starter-openfeign:${springCloudOpenfeignVersion}"
	implementation "org.springframework.boot:spring-boot-starter-data-jpa:${springBootVersion}"

	implementation "org.hibernate.orm:hibernate-envers:${hibernateVersion}"
    implementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"
	implementation "io.hypersistence:hypersistence-utils-hibernate-63:${hypersistenceUtilsVersion}"

	implementation "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
	runtimeOnly "org.postgresql:postgresql:${postgresqlVersion}"

	testFixturesApi "org.testcontainers:testcontainers:${testcontainersVersion}"
	testFixturesApi "org.testcontainers:testcontainers-postgresql:${testcontainersVersion}"
	testFixturesApi "org.springframework.boot:spring-boot-testcontainers:${springBootVersion}"
	testFixturesImplementation "org.springframework.boot:spring-boot-starter-test:${springBootVersion}"
}
